name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          frozen: true
      - run: pixi run lint
      - run: pixi run format-check
      - run: pixi run backend-typecheck
      - run: pixi run frontend-typecheck
      - run: pixi run frontend-knip
      - run: pixi run backend-test
      - run: pixi run frontend-build
