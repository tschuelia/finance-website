lefthook: pixi run lefthook
glob_matcher: doublestar

pre-commit:
  fail_on_changes: always
  commands:
    check-yaml:
      priority: 1
      glob:
        - "**/*.yaml"
        - "**/*.yml"
      run: pixi run check-yaml {staged_files}
    end-of-file-fixer:
      priority: 2
      file_types: text
      run: pixi run end-of-file-fixer {staged_files}
    trailing-whitespace:
      priority: 3
      file_types: text
      run: pixi run trailing-whitespace-fixer {staged_files}
    detect-private-key:
      priority: 4
      file_types: text
      run: pixi run detect-private-key {staged_files}
    ruff:
      priority: 5
      glob: "**/*.py"
      run: pixi run ruff check --fix -- {staged_files}
    ruff-format:
      priority: 6
      glob: "**/*.py"
      run: pixi run ruff format -- {staged_files}
    frontend-biome:
      priority: 7
      glob: "frontend/**/*.{css,html,js,json,jsx,ts,tsx}"
      run: pixi run frontend-format-staged
    frontend-eslint:
      priority: 8
      glob: "frontend/**/*.{js,jsx,ts,tsx}"
      run: pixi run frontend-lint
    frontend-knip:
      priority: 9
      glob:
        - ".gitignore"
        - "lefthook.yml"
        - "pixi.toml"
        - "frontend/**"
      run: pixi run frontend-knip
