[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finances-backend"
version = "0.1.0"
description = "FastAPI backend for the finances application"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.18.5",
  "argon2-cffi==25.1.0",
  "fastapi==0.141.1",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.52",
  "typer==0.27.1",
  "uvicorn[standard]==0.52.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app"]
