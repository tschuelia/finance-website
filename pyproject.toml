[project]
name = "finances"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
django = "*"
fontawesomefree = "*"
django-plotly-dash = "*"
django-crispy-forms = "*"
crispy-bootstrap4 = "*"
django-addanother = "*"
django-bootstrap4 = "*"
pandas = ">=2"
dash = "*"
pillow = "*"
dpd_static_support = "*"
whitenoise = "*"
django-tables2 = "*"
gunicorn = "*"
ruff = "==0.7.4"
lefthook = "==2.1.10"
pre-commit-hooks = "==6.0.0"

[tool.pixi.tasks]
dev = "python manage.py runserver"
check = "python manage.py check"
test = "python manage.py test"
lint = "ruff check ."
format-check = "ruff format --check ."
hooks-install = "lefthook install"
migrate = "python manage.py migrate"
web = "gunicorn --bind 0.0.0.0:${PORT:-8000} --log-level info --log-file - finances.wsgi:application"

[tool.ruff.lint]
select = [
  "F",    # flake8
  "I",    # isort
  "UP",   # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = [
    "accounting",
    "finances",
]
